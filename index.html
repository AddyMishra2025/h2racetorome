<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H2RaceToRome</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      .container {
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .logo {
        width: 220px;
        max-width: 100%;
        display: block;
        margin: 0 auto 20px;
      }
      .hero {
        width: 100%;
        border-radius: 12px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
      }
      .title {
        margin: 20px 0 10px;
        text-align: center;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
      }
      .subtitle {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 24px;
      }
      .card {
        background: #1e293b;
        padding: 16px;
        border-radius: 12px;
      }
      .prize {
        width: 100%;
        border-radius: 8px;
      }
      .footer {
        margin-top: 20px;
        text-align: center;
        color: #94a3b8;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <img src="./vestaone-logo-reversed.png" alt="VestaOne logo" class="logo" />
      <img src="./rome-hero.png" alt="H2RaceToRome Hero" class="hero" />
      <h1 class="title">H2RaceToRome</h1>
      <p class="subtitle">Welcome to the official race page.</p>
      <section class="card">
        <img src="./rome-prize.png" alt="Rome Prize" class="prize" />
      </section>
      <p class="footer">Page deployed with GitHub Pages.</p>
    </main>
  </body>
</html>
